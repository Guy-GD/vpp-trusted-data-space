[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vpp-common"
version = "0.1.0"
description = "Cross-service response, error, tracing, ID, and base schema utilities."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
